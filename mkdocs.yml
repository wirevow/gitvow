site_name: gitvow
site_description: Provenance and a policy gate for AI-agent coding sessions, stored in git you already have.
repo_url: https://github.com/wirevow/gitvow
site_url: https://wirevow.dev/gitvow/
theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features: [navigation.sections, navigation.expand, content.code.copy, search.suggest, navigation.footer]
extra_css: [stylesheets/wirevow.css]

markdown_extensions: [admonition, tables, toc, pymdownx.superfences, pymdownx.details]
copyright: © 2026 Wirevow · <a href='https://wirevow.com'>wirevow.com</a>
nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Concepts:
      - Sessions, steps and notes: concepts/sessions.md
      - The gate: concepts/gate.md
      - What stays out of git: concepts/storage.md
      - Snapshots, the code as the agent left it: concepts/snapshots.md
      - Providers, policy from facts: concepts/providers.md
      - Decisions, who agreed: concepts/decisions.md
  - Guides:
      - Install per user or per repo: guides/install.md
      - Write a policy: guides/policy.md
      - Read a commit's session: guides/reading.md
      - Run a trial and collect results: guides/trial.md
      - Redaction and custom rules: guides/redaction.md
      - Session notes on pull requests: guides/pull-requests.md
      - Wire a provider: guides/providers.md
      - Restore what the agent had: guides/snapshots.md
      - Codex, Cursor and other agents: guides/other-agents.md
      - Let the agent ask the record: guides/skills.md
      - A period in one page: guides/digest.md
      - What each session cost: guides/cost.md
      - Answer the card: guides/decisions.md
  - Reference:
      - CLI: reference/cli.md
      - Hook payloads: reference/hooks.md
      - Session note schema: reference/note.md
      - Policy schema: reference/policy.md
      - Provider protocol: reference/provider-protocol.md
      - Adapters for other agents: reference/adapters.md
      - External adapter protocol: reference/adapter-protocol.md
  - Security: security.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
  - Architecture: ARCHITECTURE.md
  - Contributing: contributing.md
