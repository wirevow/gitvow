name: gitvow
description: Post each pull request's agent session notes as a comment and job summary; fail when notes are missing.
branding: {icon: git-commit, color: purple}
inputs:
  require-notes:
    description: Fail when a commit carries a session trailer but its note was not pushed.
    default: "true"
  comment:
    description: Post or update the pull request comment.
    default: "true"
  version:
    description: gitvow version to install (pip specifier). Defaults to the action's own tag.
    default: ""
  pr-description:
    description: Write the decisions trailer block into the pull request description so a squash commit inherits it. auto (only when the repository allows squash merges alone), always, never.
    default: "auto"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with: {python-version: "3.12"}
    - shell: bash
      run: |
        set -euo pipefail
        spec="${{ inputs.version }}"
        if [ -z "$spec" ]; then
          ref="${{ github.action_ref }}"
          case "$ref" in v*) spec="==${ref#v}" ;; *) spec="" ;; esac
        fi
        case "$spec" in
          git+*|https://*|/*|./*) pip install -q "$spec" ;;
          ""|[=\<\>~!]*) pip install -q "gitvow${spec}" || pip install -q gitvow ;;
          *) pip install -q "gitvow==${spec}" ;;
        esac
        git fetch --quiet origin '+refs/notes/gitvow/*:refs/notes/gitvow/*' || true
        git fetch --quiet origin '+refs/notes/sessions:refs/notes/sessions' 2>/dev/null || true
        base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
        git fetch --quiet origin "$base" "$head" || true
        set +e
        target="${{ github.event.pull_request.base.ref }}"
        gitvow report --base "$base" --head "$head" ${target:+--target "$target"} $([ "${{ inputs.require-notes }}" = "true" ] && echo --require-notes) > gitvow-report.md
        rc=$?
        set -e
        gitvow report --base "$base" --head "$head" --decisions-summary > gitvow-decisions.txt || true
        cat gitvow-report.md >> "$GITHUB_STEP_SUMMARY"
        cat gitvow-report.md
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.comment }}" = "true" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
          { echo "<!-- gitvow-report -->"; cat gitvow-report.md; } > body.md
          pr=${{ github.event.pull_request.number }}
          existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate --jq '.[] | select(.body | startswith("<!-- gitvow-report -->")) | .id' | head -1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@body.md --silent
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$pr/comments" -F body=@body.md --silent
          fi
        fi
        mode="${{ inputs.pr-description }}"
        if [ "$mode" = "auto" ]; then
          allow=$(gh api "repos/${{ github.repository }}" --jq '[.allow_squash_merge, .allow_merge_commit, .allow_rebase_merge] | map(tostring) | join(",")' 2>/dev/null || echo "")
          [ "$allow" = "true,false,false" ] && mode=always || mode=never
        fi
        if [ "$mode" = "always" ] && [ -n "${{ github.event.pull_request.number }}" ] && [ -s gitvow-decisions.txt ]; then
          pr=${{ github.event.pull_request.number }}
          gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.body // ""' > pr-body.md
          python3 - pr-body.md gitvow-decisions.txt <<'PY'
        import re, sys
        body = open(sys.argv[1]).read(); block = open(sys.argv[2]).read().rstrip("\n")
        pat = re.compile(r"<!-- gitvow-decisions -->.*?<!-- /gitvow-decisions -->", re.S)
        new = pat.sub(lambda m: block, body) if pat.search(body) else (body.rstrip("\n") + "\n\n" + block + "\n")
        open(sys.argv[1], "w").write(new)
        PY
          gh api -X PATCH "repos/${{ github.repository }}/pulls/$pr" -F body=@pr-body.md --silent
        fi
        exit $rc
      env:
        GH_TOKEN: ${{ github.token }}
