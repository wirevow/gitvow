name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: |
          test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match pyproject version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: pypi, url: "https://pypi.org/p/gitvow"}
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file <(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## /{f=0} f' CHANGELOG.md)
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Move the vMAJOR.MINOR tag used by the GitHub Action
        run: |
          minor="${GITHUB_REF_NAME%.*}"
          git config user.name github-actions && git config user.email github-actions@github.com
          git tag -f "$minor" "$GITHUB_SHA" && git push -f origin "refs/tags/$minor"
